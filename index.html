<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Diario terapia orale</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { overscroll-behavior-y: contain; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body class="bg-slate-50">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

/* ------------------------------------------------------------------ */
/* Date helpers                                                        */
/* ------------------------------------------------------------------ */

const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const c = new Date(d); c.setDate(c.getDate() + n); return c; };
const daysBetween = (a, b) => Math.round((fromKey(b) - fromKey(a)) / 86400000);
const shortDate = (key) => { const d = fromKey(key); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
const WEEKDAYS = ["lun", "mar", "mer", "gio", "ven", "sab", "dom"];
const MONTHS = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const weekdayLabel = (key) => WEEKDAYS[(fromKey(key).getDay() + 6) % 7];
const longDate = (key) => { const d = fromKey(key); return `${WEEKDAYS[(d.getDay() + 6) % 7]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const nowTime = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ------------------------------------------------------------------ */
/* Model + archivio locale                                             */
/* ------------------------------------------------------------------ */

const STORAGE_KEY = "diario-terapia-v1";

const defaultState = () => ({
  config: {
    startDate: toKey(new Date()),
    onDays1: 5, pauseDays: 2, onDays2: 5, cycleLength: 28,
    doseA: 2, doseB: 2,
    timeM: "08:30", timeE: "20:30",
    packSize: 20, stockA: 0, stockB: 0,
  },
  log: {},
});

let storageWorks = true;
function readStore() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    return { config: { ...defaultState().config, ...p.config }, log: p.log || {} };
  } catch (e) { storageWorks = false; return null; }
}
function writeStore(state) {
  try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
  catch (e) { storageWorks = false; return false; }
}

const SYMPTOMS = [
  { k: "nausea", label: "Nausea" },
  { k: "vomito", label: "Vomito" },
  { k: "diarrea", label: "Diarrea" },
  { k: "cute", label: "Prurito / cute" },
  { k: "stanchezza", label: "Stanchezza" },
  { k: "altro", label: "Altro" },
];
const SEV = ["Lieve", "Moderato", "Severo"];

function dayInfo(key, cfg) {
  const delta = daysBetween(cfg.startDate, key);
  if (delta < 0) return { before: true };
  const cycle = Math.floor(delta / cfg.cycleLength) + 1;
  const day = (delta % cfg.cycleLength) + 1;
  const b1End = cfg.onDays1;
  const pEnd = b1End + cfg.pauseDays;
  const b2End = pEnd + cfg.onDays2;
  let phase = "riposo";
  if (day <= b1End) phase = "terapia";
  else if (day <= pEnd) phase = "pausa";
  else if (day <= b2End) phase = "terapia";
  return { cycle, day, phase, due: phase === "terapia", before: false };
}

/* ------------------------------------------------------------------ */
/* UI atoms                                                            */
/* ------------------------------------------------------------------ */

const Card = ({ children, className = "" }) => (
  <div className={`rounded-2xl bg-white shadow-sm ring-1 ring-slate-200 ${className}`}>{children}</div>
);

const Btn = ({ children, onClick, tone = "ghost", className = "", disabled }) => {
  const tones = {
    solid: "bg-slate-900 text-white active:bg-slate-700",
    go: "bg-emerald-600 text-white active:bg-emerald-700",
    warn: "bg-amber-100 text-amber-900 ring-1 ring-amber-300 active:bg-amber-200",
    ghost: "bg-slate-100 text-slate-700 ring-1 ring-slate-200 active:bg-slate-200",
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`rounded-xl px-4 py-3 text-base font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900 focus-visible:ring-offset-2 disabled:opacity-40 ${tones[tone]} ${className}`}>
      {children}
    </button>
  );
};

const Field = ({ label, children, hint }) => (
  <label className="block">
    <span className="mb-1 block text-sm font-medium text-slate-600">{label}</span>
    {children}
    {hint && <span className="mt-1 block text-xs text-slate-400">{hint}</span>}
  </label>
);

const numInput = "w-full rounded-xl border-0 bg-slate-100 px-3 py-2.5 text-base text-slate-900 ring-1 ring-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900";

const Stat = ({ label, value, sub, tone }) => (
  <div className="rounded-xl bg-slate-50 p-3 ring-1 ring-slate-100">
    <div className="text-xs text-slate-500">{label}</div>
    <div className={`mt-0.5 font-mono text-2xl font-semibold ${tone || "text-slate-900"}`}>{value}</div>
    {sub && <div className="text-xs text-slate-400">{sub}</div>}
  </div>
);

/* ------------------------------------------------------------------ */
/* App                                                                 */
/* ------------------------------------------------------------------ */

function App() {
  const [state, setState] = useState(() => readStore() || defaultState());
  const [tab, setTab] = useState("oggi");
  const [openDay, setOpenDay] = useState(null);
  const [viewCycle, setViewCycle] = useState(null);
  const [noStore, setNoStore] = useState(!storageWorks);

  const todayKey = toKey(new Date());
  const cfg = state.config;
  const log = state.log;

  const persist = useCallback((next) => {
    setState(next);
    if (!writeStore(next)) setNoStore(true);
  }, []);

  const today = useMemo(() => dayInfo(todayKey, cfg), [cfg, todayKey]);

  useEffect(() => {
    if (!today.before && viewCycle === null) setViewCycle(today.cycle);
  }, [today, viewCycle]);

  /* --- mutations --- */
  const setDose = (key, slot, value) => {
    const entry = { ...(log[key] || {}) };
    if (value === null) delete entry[slot]; else entry[slot] = value;
    const nextLog = { ...log };
    if (Object.keys(entry).length === 0) delete nextLog[key]; else nextLog[key] = entry;
    persist({ ...state, log: nextLog });
  };

  const setSymptom = (key, k, sev) => {
    const entry = { ...(log[key] || {}) };
    const sym = { ...(entry.sym || {}) };
    if (sym[k] === sev) delete sym[k]; else sym[k] = sev;
    entry.sym = sym;
    if (Object.keys(sym).length === 0) delete entry.sym;
    const nextLog = { ...log };
    if (Object.keys(entry).length === 0) delete nextLog[key]; else nextLog[key] = entry;
    persist({ ...state, log: nextLog });
  };

  const setNote = (key, text) => {
    const entry = { ...(log[key] || {}) };
    if (text) entry.note = text; else delete entry.note;
    const nextLog = { ...log };
    if (Object.keys(entry).length === 0) delete nextLog[key]; else nextLog[key] = entry;
    persist({ ...state, log: nextLog });
  };

  const updateConfig = (patch) => persist({ ...state, config: { ...cfg, ...patch } });

  /* --- derived --- */
  const perDoseA = cfg.doseA, perDoseB = cfg.doseB;
  const perDayA = perDoseA * 2, perDayB = perDoseB * 2;
  const therapyDaysPerCycle = cfg.onDays1 + cfg.onDays2;

  const cycleDates = (n) => {
    const start = addDays(fromKey(cfg.startDate), (n - 1) * cfg.cycleLength);
    return Array.from({ length: cfg.cycleLength }, (_, i) => toKey(addDays(start, i)));
  };

  const stats = (() => {
    let takenDoses = 0, skippedDoses = 0, dueDoses = 0, pillsA = 0, pillsB = 0;
    let cycleTaken = 0, cyclePillsA = 0, cyclePillsB = 0;
    const symCount = {};
    Object.keys(log).forEach((k) => {
      ["m", "e"].forEach((s) => {
        const v = log[k] && log[k][s];
        if (v && v.status === "taken") {
          takenDoses++; pillsA += perDoseA; pillsB += perDoseB;
          if (viewCycle && dayInfo(k, cfg).cycle === viewCycle) {
            cycleTaken++; cyclePillsA += perDoseA; cyclePillsB += perDoseB;
          }
        }
        if (v && v.status === "skipped") skippedDoses++;
      });
      Object.entries((log[k] && log[k].sym) || {}).forEach(([sk, sv]) => {
        symCount[sk] = symCount[sk] || [0, 0, 0];
        symCount[sk][sv - 1]++;
      });
    });
    if (!today.before) {
      const total = daysBetween(cfg.startDate, todayKey);
      for (let i = 0; i <= total; i++) {
        const k = toKey(addDays(fromKey(cfg.startDate), i));
        if (dayInfo(k, cfg).due && k !== todayKey) dueDoses += 2;
      }
    }
    return { takenDoses, skippedDoses, dueDoses, pillsA, pillsB, symCount, cycleTaken, cyclePillsA, cyclePillsB };
  })();

  const remainingA = cfg.stockA - stats.pillsA;
  const remainingB = cfg.stockB - stats.pillsB;

  const nextDose = (() => {
    for (let i = 0; i < 40; i++) {
      const k = toKey(addDays(fromKey(todayKey), i));
      const info = dayInfo(k, cfg);
      if (info.before || !info.due) continue;
      for (const s of ["m", "e"]) if (!(log[k] && log[k][s])) return { key: k, slot: s };
    }
    return null;
  })();

  /* ---------------------------------------------------------------- */
  /* Componenti di vista                                               */
  /* ---------------------------------------------------------------- */

  const DoseCard = ({ dateKey, slot }) => {
    const v = (log[dateKey] || {})[slot];
    const label = slot === "m" ? "Mattina" : "Sera";
    const when = slot === "m" ? "dopo colazione" : "dopo cena";
    const plan = slot === "m" ? cfg.timeM : cfg.timeE;
    const taken = v && v.status === "taken";
    const skipped = v && v.status === "skipped";

    return (
      <Card className={taken ? "ring-emerald-300" : skipped ? "ring-amber-300" : ""}>
        <div className="flex items-baseline justify-between px-4 pt-4">
          <div>
            <div className="text-lg font-semibold tracking-tight text-slate-900">{label}</div>
            <div className="text-sm text-slate-500">{when} — entro 1 ora dalla fine del pasto</div>
          </div>
          <div className="font-mono text-sm text-slate-400">{plan}</div>
        </div>

        <div className="mx-4 mt-3 flex gap-2 rounded-xl bg-slate-50 px-3 py-2.5 font-mono text-sm text-slate-700 ring-1 ring-slate-100">
          <span>{perDoseA} × 15 mg</span>
          <span className="text-slate-300">+</span>
          <span>{perDoseB} × 20 mg</span>
          <span className="ml-auto text-slate-400">{perDoseA + perDoseB} cpr</span>
        </div>

        {taken ? (
          <div className="flex items-center gap-3 px-4 py-3">
            <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-white">✓</div>
            <div className="flex-1">
              <div className="text-sm font-medium text-emerald-800">Presa</div>
              <input type="time" value={v.time || ""}
                onChange={(e) => setDose(dateKey, slot, { ...v, time: e.target.value })}
                className="mt-0.5 rounded-lg bg-slate-100 px-2 py-1 font-mono text-sm text-slate-700 ring-1 ring-slate-200" />
            </div>
            <button onClick={() => setDose(dateKey, slot, null)} className="text-sm text-slate-400 underline">Annulla</button>
          </div>
        ) : skipped ? (
          <div className="flex items-center gap-3 px-4 py-3">
            <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-amber-400 text-white">!</div>
            <div className="flex-1">
              <div className="text-sm font-medium text-amber-800">Non presa</div>
              <input placeholder="Motivo (facoltativo)" value={v.reason || ""}
                onChange={(e) => setDose(dateKey, slot, { ...v, reason: e.target.value })}
                className="mt-0.5 w-full rounded-lg bg-slate-100 px-2 py-1 text-sm text-slate-700 ring-1 ring-slate-200" />
            </div>
            <button onClick={() => setDose(dateKey, slot, null)} className="text-sm text-slate-400 underline">Annulla</button>
          </div>
        ) : (
          <div className="flex gap-2 p-4 pt-3">
            <Btn tone="go" className="flex-1"
              onClick={() => setDose(dateKey, slot, { status: "taken", time: dateKey === todayKey ? nowTime() : plan })}>
              Presa
            </Btn>
            <Btn tone="warn" onClick={() => setDose(dateKey, slot, { status: "skipped" })}>Non presa</Btn>
          </div>
        )}
      </Card>
    );
  };

  const SymptomRows = ({ dateKey, dark }) => {
    const e = log[dateKey] || {};
    return (
      <div className="mt-3 space-y-2">
        {SYMPTOMS.map((s) => {
          const cur = e.sym && e.sym[s.k];
          return (
            <div key={s.k} className="flex items-center gap-2">
              <span className={`flex-1 text-sm ${cur ? "font-medium text-slate-900" : "text-slate-500"}`}>{s.label}</span>
              {[1, 2, 3].map((lvl) => (
                <button key={lvl} onClick={() => setSymptom(dateKey, s.k, lvl)}
                  className={`h-9 w-14 rounded-lg text-xs font-medium ring-1 ${
                    cur === lvl
                      ? lvl === 1 ? "bg-sky-100 text-sky-900 ring-sky-300"
                        : lvl === 2 ? "bg-amber-100 text-amber-900 ring-amber-300"
                        : "bg-rose-100 text-rose-900 ring-rose-300"
                      : "bg-white text-slate-400 ring-slate-200"}`}>
                  {SEV[lvl - 1].slice(0, 3)}
                </button>
              ))}
            </div>
          );
        })}
      </div>
    );
  };

  /* ---- Oggi ---- */
  const Oggi = () => {
    if (today.before) {
      return (
        <Card className="p-5 text-center">
          <div className="text-slate-500">La terapia inizia il</div>
          <div className="mt-1 text-2xl font-semibold text-slate-900">{longDate(cfg.startDate)}</div>
          <Btn className="mt-4" onClick={() => setTab("terapia")}>Cambia data di inizio</Btn>
        </Card>
      );
    }
    const e = log[todayKey] || {};
    const doneToday = ["m", "e"].filter((s) => e[s] && e[s].status === "taken").length;

    return (
      <div className="space-y-4">
        <div className="rounded-2xl bg-slate-900 p-5 text-white">
          <div className="flex items-end justify-between">
            <div>
              <div className="text-xs uppercase tracking-widest text-slate-400">Ciclo {today.cycle}</div>
              <div className="mt-1 flex items-baseline gap-2">
                <span className="font-mono text-5xl font-semibold leading-none">{today.day}</span>
                <span className="font-mono text-lg text-slate-400">/ {cfg.cycleLength}</span>
              </div>
              <div className="mt-2 text-sm text-slate-300">{longDate(todayKey)}</div>
            </div>
            <div className="text-right">
              <span className={`inline-block rounded-full px-3 py-1 text-sm font-medium ${
                today.phase === "terapia" ? "bg-emerald-500 text-white" : "bg-slate-700 text-slate-200"}`}>
                {today.phase === "terapia" ? "Giorno di terapia" : today.phase === "pausa" ? "Pausa 2 giorni" : "Riposo"}
              </span>
              {today.due && <div className="mt-2 font-mono text-sm text-slate-400">{doneToday}/2 assunzioni</div>}
            </div>
          </div>
          <div className="mt-4 grid grid-cols-7 gap-1">
            {cycleDates(today.cycle).map((k) => {
              const info = dayInfo(k, cfg);
              const le = log[k];
              const done = ["m", "e"].filter((s) => le && le[s] && le[s].status === "taken").length;
              let cls = "bg-slate-700";
              if (!info.due) cls = "bg-slate-800";
              else if (done === 2) cls = "bg-emerald-400";
              else if (done === 1) cls = "bg-emerald-700";
              return <div key={k} className={`h-2 rounded-full ${cls} ${k === todayKey ? "ring-2 ring-white ring-offset-1 ring-offset-slate-900" : ""}`} />;
            })}
          </div>
        </div>

        {today.due ? (
          <>
            <DoseCard dateKey={todayKey} slot="m" />
            <DoseCard dateKey={todayKey} slot="e" />
          </>
        ) : (
          <Card className="p-5">
            <div className="text-lg font-semibold text-slate-900">Nessuna compressa oggi</div>
            <div className="mt-1 text-sm text-slate-500">
              {today.phase === "pausa" ? "Sono i 2 giorni di pausa fra i due blocchi." : "Periodo di riposo fino al ciclo successivo."}
            </div>
            {nextDose && (
              <div className="mt-3 rounded-xl bg-slate-50 px-3 py-2.5 text-sm text-slate-700 ring-1 ring-slate-100">
                Prossima assunzione: <strong>{longDate(nextDose.key)}</strong>, {nextDose.slot === "m" ? "mattina" : "sera"}
                {" "}({nextDose.slot === "m" ? cfg.timeM : cfg.timeE})
              </div>
            )}
          </Card>
        )}

        <Card className="p-4">
          <div className="text-sm font-semibold text-slate-900">Disturbi di oggi</div>
          <SymptomRows dateKey={todayKey} />
          <textarea placeholder="Nota per il prossimo controllo…" value={e.note || ""} rows={2}
            onChange={(ev) => setNote(todayKey, ev.target.value)}
            className="mt-3 w-full rounded-xl bg-slate-50 px-3 py-2 text-sm ring-1 ring-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </Card>
      </div>
    );
  };

  /* ---- Calendario ---- */
  const Calendario = () => {
    const vc = viewCycle || 1;
    const maxCycle = Math.max(today.before ? 1 : today.cycle, vc);
    const dates = cycleDates(vc);
    return (
      <div className="space-y-4">
        <div className="flex items-center justify-between">
          <Btn onClick={() => setViewCycle(Math.max(1, vc - 1))} disabled={vc <= 1}>←</Btn>
          <div className="text-center">
            <div className="text-lg font-semibold text-slate-900">Ciclo {vc}</div>
            <div className="font-mono text-xs text-slate-500">{shortDate(dates[0])} – {shortDate(dates[dates.length - 1])}</div>
          </div>
          <Btn onClick={() => setViewCycle(vc + 1)} disabled={vc >= maxCycle + 1}>→</Btn>
        </div>

        <Card className="p-4">
          <div className="mb-3 grid grid-cols-7 gap-1.5 text-center text-[10px] uppercase tracking-wide text-slate-400">
            {dates.slice(0, 7).map((k) => <div key={k}>{weekdayLabel(k)}</div>)}
          </div>
          <div className="grid grid-cols-7 gap-1.5">
            {dates.map((k) => {
              const info = dayInfo(k, cfg);
              const e = log[k];
              const done = ["m", "e"].filter((s) => e && e[s] && e[s].status === "taken").length;
              const miss = ["m", "e"].some((s) => e && e[s] && e[s].status === "skipped");
              const past = k < todayKey;
              let cls = "bg-white text-slate-500 ring-slate-200";
              if (!info.due) cls = "bg-slate-100 text-slate-300 ring-slate-100";
              else if (done === 2) cls = "bg-emerald-600 text-white ring-emerald-600";
              else if (done === 1) cls = "bg-emerald-100 text-emerald-800 ring-emerald-300";
              else if (miss) cls = "bg-amber-100 text-amber-800 ring-amber-300";
              else if (past) cls = "bg-white text-slate-400 ring-slate-300";
              return (
                <button key={k} onClick={() => setOpenDay(k)}
                  className={`flex aspect-square flex-col items-center justify-center rounded-lg text-xs font-medium ring-1 ${cls} ${k === todayKey ? "outline outline-2 outline-offset-2 outline-slate-900" : ""}`}>
                  <span className="font-mono">{info.day}</span>
                  <span className="text-[9px] opacity-60">{shortDate(k)}</span>
                </button>
              );
            })}
          </div>
          <div className="mt-4 flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500">
            <span className="flex items-center gap-1.5"><i className="h-3 w-3 rounded bg-emerald-600" />2 assunzioni</span>
            <span className="flex items-center gap-1.5"><i className="h-3 w-3 rounded bg-emerald-100 ring-1 ring-emerald-300" />1 su 2</span>
            <span className="flex items-center gap-1.5"><i className="h-3 w-3 rounded bg-amber-100 ring-1 ring-amber-300" />non presa</span>
            <span className="flex items-center gap-1.5"><i className="h-3 w-3 rounded bg-slate-100" />pausa</span>
          </div>
        </Card>

        <Card className="p-4">
          <div className="text-sm font-semibold text-slate-900">Riepilogo ciclo {vc}</div>
          <div className="mt-3 grid grid-cols-2 gap-3">
            <Stat label="Assunzioni fatte" value={stats.cycleTaken} sub={`su ${therapyDaysPerCycle * 2} previste`} />
            <Stat label="Compresse usate" value={stats.cyclePillsA + stats.cyclePillsB} sub={`${stats.cyclePillsA}×15 + ${stats.cyclePillsB}×20`} />
          </div>
        </Card>

        <Trascrizione cycle={vc} />
      </div>
    );
  };

  const Trascrizione = ({ cycle }) => {
    const [show, setShow] = useState(false);
    const dates = cycleDates(cycle);
    const lines = dates.filter((k) => log[k]).map((k) => {
      const e = log[k];
      const f = (s) => e[s] && e[s].status === "taken" ? `SI ${e[s].time || ""}`.trim()
        : e[s] && e[s].status === "skipped" ? `NO ${e[s].reason || ""}`.trim() : "—";
      const sym = Object.entries(e.sym || {})
        .map(([sk, sv]) => `${SYMPTOMS.find((x) => x.k === sk).label} (${SEV[sv - 1].toLowerCase()})`).join(", ");
      return `${shortDate(k)}  mattina: ${f("m")}  |  sera: ${f("e")}${sym ? `  |  ${sym}` : ""}${e.note ? `  |  ${e.note}` : ""}`;
    });
    return (
      <Card className="p-4">
        <div className="text-sm font-semibold text-slate-900">Trascrizione per il diario cartaceo</div>
        <p className="mt-1 text-xs text-slate-500">Il diario di carta va comunque consegnato: qui le righe pronte da ricopiare.</p>
        <Btn className="mt-3 w-full" onClick={() => setShow(!show)}>{show ? "Nascondi" : `Mostra ciclo ${cycle}`}</Btn>
        {show && (
          <textarea readOnly value={lines.join("\n") || "Nessuna registrazione in questo ciclo."}
            rows={Math.min(14, Math.max(3, lines.length + 1))}
            className="mt-3 w-full rounded-xl bg-slate-50 p-3 font-mono text-xs text-slate-700 ring-1 ring-slate-200" />
        )}
      </Card>
    );
  };

  /* ---- Conteggi ---- */
  const Conteggi = () => {
    const adherence = stats.dueDoses > 0 ? Math.round((stats.takenDoses / stats.dueDoses) * 100) : null;
    const daysLeftA = perDayA > 0 ? Math.floor(remainingA / perDayA) : 0;
    const daysLeftB = perDayB > 0 ? Math.floor(remainingB / perDayB) : 0;
    const packsA = ((therapyDaysPerCycle * perDayA) / cfg.packSize).toFixed(1);
    const packsB = ((therapyDaysPerCycle * perDayB) / cfg.packSize).toFixed(1);

    return (
      <div className="space-y-4">
        <Card className="p-4">
          <div className="text-sm font-semibold text-slate-900">Andamento complessivo</div>
          <div className="mt-3 grid grid-cols-2 gap-3">
            <Stat label="Aderenza" value={adherence === null ? "—" : `${adherence}%`} sub={`${stats.takenDoses}/${stats.dueDoses} dosi`} />
            <Stat label="Dosi saltate" value={stats.skippedDoses} tone={stats.skippedDoses ? "text-amber-700" : "text-slate-900"} />
            <Stat label="Compresse 15 mg" value={stats.pillsA} sub="totale assunte" />
            <Stat label="Compresse 20 mg" value={stats.pillsB} sub="totale assunte" />
          </div>
          <p className="mt-3 text-xs text-slate-400">L'aderenza esclude le dosi di oggi, ancora aperte.</p>
        </Card>

        <Card className="p-4">
          <div className="text-sm font-semibold text-slate-900">Scorte</div>
          <p className="mt-1 text-xs text-slate-500">Aggiorna il totale quando ritiri il farmaco: l'app sottrae ogni assunzione registrata.</p>
          <div className="mt-3 grid grid-cols-2 gap-3">
            <Field label="Compresse 15 mg ritirate">
              <input type="number" inputMode="numeric" className={numInput} value={cfg.stockA}
                onChange={(e) => updateConfig({ stockA: Number(e.target.value) || 0 })} />
            </Field>
            <Field label="Compresse 20 mg ritirate">
              <input type="number" inputMode="numeric" className={numInput} value={cfg.stockB}
                onChange={(e) => updateConfig({ stockB: Number(e.target.value) || 0 })} />
            </Field>
          </div>
          <div className="mt-3 grid grid-cols-2 gap-3">
            <Stat label="Restano 15 mg" value={remainingA} sub={`≈ ${daysLeftA} giorni di terapia`}
              tone={remainingA < perDayA * 3 ? "text-amber-700" : "text-slate-900"} />
            <Stat label="Restano 20 mg" value={remainingB} sub={`≈ ${daysLeftB} giorni di terapia`}
              tone={remainingB < perDayB * 3 ? "text-amber-700" : "text-slate-900"} />
          </div>
          <div className="mt-3 rounded-xl bg-slate-50 p-3 text-sm text-slate-600 ring-1 ring-slate-100">
            Un ciclo completo richiede <strong>{therapyDaysPerCycle * perDayA} cpr da 15 mg</strong> ({packsA} confezioni da {cfg.packSize}) e{" "}
            <strong>{therapyDaysPerCycle * perDayB} cpr da 20 mg</strong> ({packsB} confezioni).
          </div>
        </Card>

        <Card className="p-4">
          <div className="text-sm font-semibold text-slate-900">Disturbi registrati</div>
          <div className="mt-3 space-y-2">
            {SYMPTOMS.map((s) => {
              const c = stats.symCount[s.k] || [0, 0, 0];
              const tot = c[0] + c[1] + c[2];
              return (
                <div key={s.k} className="flex items-center gap-3">
                  <span className="w-32 shrink-0 text-sm text-slate-600">{s.label}</span>
                  <div className="flex h-3 flex-1 overflow-hidden rounded-full bg-slate-100">
                    {tot > 0 && (
                      <>
                        <div className="bg-sky-300" style={{ width: `${(c[0] / tot) * 100}%` }} />
                        <div className="bg-amber-300" style={{ width: `${(c[1] / tot) * 100}%` }} />
                        <div className="bg-rose-400" style={{ width: `${(c[2] / tot) * 100}%` }} />
                      </>
                    )}
                  </div>
                  <span className="w-8 text-right font-mono text-sm text-slate-500">{tot || "—"}</span>
                </div>
              );
            })}
          </div>
        </Card>

        <Backup state={state} persist={persist} />
      </div>
    );
  };

  const Backup = ({ state, persist }) => {
    const [show, setShow] = useState(false);
    const [text, setText] = useState("");
    const [msg, setMsg] = useState("");
    const dump = JSON.stringify(state);
    return (
      <Card className="p-4">
        <div className="text-sm font-semibold text-slate-900">Copia di sicurezza</div>
        <p className="mt-1 text-xs text-slate-500">
          I dati stanno solo in questo browser. Copia il testo qui sotto e salvalo (mail a te stesso, note) per poterlo
          ripristinare su un altro dispositivo o dopo la pulizia della cache.
        </p>
        <Btn className="mt-3 w-full" onClick={() => { setShow(!show); setText(dump); setMsg(""); }}>
          {show ? "Nascondi" : "Apri backup e ripristino"}
        </Btn>
        {show && (
          <div className="mt-3 space-y-2">
            <textarea value={text} onChange={(e) => setText(e.target.value)} rows={5}
              className="w-full rounded-xl bg-slate-50 p-3 font-mono text-[11px] text-slate-700 ring-1 ring-slate-200" />
            <div className="flex gap-2">
              <Btn tone="ghost" className="flex-1" onClick={() => {
                try { navigator.clipboard.writeText(dump); setMsg("Copiato."); }
                catch (e) { setMsg("Copia non disponibile: seleziona il testo a mano."); }
              }}>Copia</Btn>
              <Btn tone="solid" className="flex-1" onClick={() => {
                try {
                  const p = JSON.parse(text);
                  if (!p.config || !p.log) throw new Error("formato");
                  persist({ config: { ...defaultState().config, ...p.config }, log: p.log });
                  setMsg("Dati ripristinati.");
                } catch (e) { setMsg("Testo non valido: incolla il backup completo."); }
              }}>Ripristina</Btn>
            </div>
            {msg && <div className="text-xs text-slate-500">{msg}</div>}
          </div>
        )}
      </Card>
    );
  };

  /* ---- Terapia ---- */
  const Terapia = () => (
    <div className="space-y-4">
      <Card className="p-4">
        <div className="text-sm font-semibold text-slate-900">Schema del ciclo</div>
        <div className="mt-3 space-y-3">
          <Field label="Primo giorno di terapia (giorno 1)">
            <input type="date" className={numInput} value={cfg.startDate}
              onChange={(e) => e.target.value && updateConfig({ startDate: e.target.value })} />
          </Field>
          <div className="grid grid-cols-3 gap-2">
            <Field label="Giorni ON"><input type="number" inputMode="numeric" className={numInput} value={cfg.onDays1}
              onChange={(e) => updateConfig({ onDays1: Number(e.target.value) || 1 })} /></Field>
            <Field label="Pausa"><input type="number" inputMode="numeric" className={numInput} value={cfg.pauseDays}
              onChange={(e) => updateConfig({ pauseDays: Number(e.target.value) || 0 })} /></Field>
            <Field label="Giorni ON"><input type="number" inputMode="numeric" className={numInput} value={cfg.onDays2}
              onChange={(e) => updateConfig({ onDays2: Number(e.target.value) || 1 })} /></Field>
          </div>
          <Field label="Durata totale del ciclo (giorni)" hint="28 giorni: dopo il giorno 12 resta il periodo di riposo.">
            <input type="number" inputMode="numeric" className={numInput} value={cfg.cycleLength}
              onChange={(e) => updateConfig({ cycleLength: Math.max(cfg.onDays1 + cfg.pauseDays + cfg.onDays2, Number(e.target.value) || 28) })} />
          </Field>
        </div>
      </Card>

      <Card className="p-4">
        <div className="text-sm font-semibold text-slate-900">Dose per assunzione</div>
        <div className="mt-3 grid grid-cols-2 gap-3">
          <Field label="Compresse 15 mg"><input type="number" inputMode="numeric" className={numInput} value={cfg.doseA}
            onChange={(e) => updateConfig({ doseA: Number(e.target.value) || 0 })} /></Field>
          <Field label="Compresse 20 mg"><input type="number" inputMode="numeric" className={numInput} value={cfg.doseB}
            onChange={(e) => updateConfig({ doseB: Number(e.target.value) || 0 })} /></Field>
          <Field label="Ora mattina"><input type="time" className={numInput} value={cfg.timeM}
            onChange={(e) => updateConfig({ timeM: e.target.value })} /></Field>
          <Field label="Ora sera"><input type="time" className={numInput} value={cfg.timeE}
            onChange={(e) => updateConfig({ timeE: e.target.value })} /></Field>
          <Field label="Compresse per confezione"><input type="number" inputMode="numeric" className={numInput} value={cfg.packSize}
            onChange={(e) => updateConfig({ packSize: Number(e.target.value) || 20 })} /></Field>
        </div>
        <p className="mt-3 text-xs text-slate-500">
          Le due assunzioni vanno prese a circa 12 ore di distanza, entro un'ora dalla fine di colazione e cena, sempre alla stessa ora.
        </p>
      </Card>

      <Card className="p-4">
        <div className="text-sm font-semibold text-slate-900">In caso di dose dimenticata</div>
        <p className="mt-1 text-sm text-slate-600">
          Secondo il foglio del reparto: si riprende dalla dose successiva all'orario previsto, senza aggiungere la dose
          saltata. Registrala come «Non presa» così il conteggio delle compresse resta corretto.
        </p>
      </Card>
    </div>
  );

  /* ---- Scheda giorno ---- */
  const DaySheet = () => {
    if (!openDay) return null;
    const info = dayInfo(openDay, cfg);
    const e = log[openDay] || {};
    return (
      <div className="fixed inset-0 z-50 flex items-end bg-slate-900/40" onClick={() => setOpenDay(null)}>
        <div className="max-h-[85vh] w-full overflow-y-auto rounded-t-3xl bg-slate-50 p-4 pb-10" onClick={(ev) => ev.stopPropagation()}>
          <div className="mx-auto mb-3 h-1 w-10 rounded-full bg-slate-300" />
          <div className="mb-3 flex items-baseline justify-between">
            <div>
              <div className="text-lg font-semibold text-slate-900">{longDate(openDay)}</div>
              <div className="text-sm text-slate-500">Ciclo {info.cycle} · giorno {info.day} · {info.phase}</div>
            </div>
            <button onClick={() => setOpenDay(null)} className="rounded-lg px-3 py-1 text-sm text-slate-500 ring-1 ring-slate-200">Chiudi</button>
          </div>
          {info.due ? (
            <div className="space-y-3">
              <DoseCard dateKey={openDay} slot="m" />
              <DoseCard dateKey={openDay} slot="e" />
            </div>
          ) : (
            <Card className="p-4 text-sm text-slate-600">Giorno senza terapia.</Card>
          )}
          <Card className="mt-3 p-4">
            <div className="text-sm font-semibold text-slate-900">Disturbi</div>
            <SymptomRows dateKey={openDay} />
            <textarea placeholder="Nota" value={e.note || ""} rows={2}
              onChange={(ev) => setNote(openDay, ev.target.value)}
              className="mt-3 w-full rounded-xl bg-white px-3 py-2 text-sm ring-1 ring-slate-200" />
          </Card>
        </div>
      </div>
    );
  };

  const TABS = [
    { k: "oggi", label: "Oggi" },
    { k: "calendario", label: "Calendario" },
    { k: "conteggi", label: "Conteggi" },
    { k: "terapia", label: "Terapia" },
  ];

  return (
    <div className="min-h-screen bg-slate-50 pb-24 text-slate-900">
      <div className="mx-auto max-w-lg px-4 pt-5">
        <div className="mb-4 flex items-center justify-between">
          <h1 className="text-base font-semibold tracking-tight">Diario terapia orale</h1>
        </div>

        {noStore && (
          <div className="mb-4 rounded-xl bg-amber-50 px-3 py-2 text-xs text-amber-900 ring-1 ring-amber-200">
            Questo browser non permette di salvare i dati: le registrazioni andranno perse alla chiusura. Apri il file
            con Chrome, non in una finestra anonima.
          </div>
        )}

        {tab === "oggi" && <Oggi />}
        {tab === "calendario" && <Calendario />}
        {tab === "conteggi" && <Conteggi />}
        {tab === "terapia" && <Terapia />}
      </div>

      <nav className="fixed inset-x-0 bottom-0 border-t border-slate-200 bg-white">
        <div className="mx-auto flex max-w-lg">
          {TABS.map((t) => (
            <button key={t.k} onClick={() => setTab(t.k)}
              className={`flex-1 py-3.5 text-sm font-medium ${tab === t.k ? "text-slate-900" : "text-slate-400"}`}>
              <span className={`mx-auto block w-fit pb-1 ${tab === t.k ? "border-b-2 border-slate-900" : ""}`}>{t.label}</span>
            </button>
          ))}
        </div>
      </nav>

      <DaySheet />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
